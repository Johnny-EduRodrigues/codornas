[project]
name = "back"
version = "0.1.0"
description = "SIRA backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]
[tool.vercel]
entrypoint = "src.siraback.app:app"
